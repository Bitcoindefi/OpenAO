name: Docker builds

on:
  pull_request:
    paths:
      - api/Dockerfile
      - api/.dockerignore
      - api/package.json
      - api/pnpm-lock.yaml
      - api/pnpm-workspace.yaml
      - server/Dockerfile
      - server/.dockerignore
      - server/package.json
      - server/pnpm-lock.yaml
      - server/pnpm-workspace.yaml
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - frontend/pnpm-workspace.yaml
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Docker changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      server: ${{ steps.filter.outputs.server }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect affected images
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/docker.yml'
            server:
              - 'server/**'
              - '.github/workflows/docker.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker.yml'

  build:
    name: Build ${{ matrix.component }} image
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.server == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, server, frontend]
    steps:
      - name: Checkout repository
        if: needs.changes.outputs[matrix.component] == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.component] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        if: needs.changes.outputs[matrix.component] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
