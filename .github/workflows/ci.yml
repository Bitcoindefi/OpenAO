name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-protocol:
    name: Shared Protocol Package (Build & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Protocol
        run: pnpm --filter @openao/protocol run build

  check-api:
    name: API (Typecheck, Lint & Integration Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aoweb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck API
        run: pnpm --filter argentumonlineweb-api exec tsc --noEmit

      - name: Restore initial database dump
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d aoweb -f database/aoweb.sql

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoweb
          TOKEN_AUTH: test_token
        run: pnpm --filter argentumonlineweb-api run migrate

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoweb
          TOKEN_AUTH: test_token
          PORT: 3001
          CORS_ORIGIN: http://localhost:3000
          SITE_URL: http://localhost:3000
        run: pnpm --filter argentumonlineweb-api test

  check-server:
    name: Game Server (Typecheck, Lint & Unit Tests)
    runs-on: ubuntu-latest
    needs: check-protocol

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Protocol
        run: pnpm --filter @openao/protocol run build

      - name: Typecheck Server
        run: pnpm --filter argentumonlineweb_server exec tsc --noEmit

      - name: Lint Server
        run: pnpm --filter argentumonlineweb_server run lint

      - name: Run Server Tests
        run: pnpm --filter argentumonlineweb_server test

  check-frontend:
    name: Frontend (Typecheck & Lint)
    runs-on: ubuntu-latest
    needs: check-protocol

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Protocol
        run: pnpm --filter @openao/protocol run build

      - name: Typecheck Frontend
        run: pnpm --filter falopita exec tsc --noEmit

      - name: Lint Frontend
        run: pnpm --filter falopita run lint

  check-docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'docker') ||
        contains(github.event.pull_request.labels.*.name, 'deploy')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: openao-api:test

      - name: Build Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: openao-server:test

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: openao-frontend:test
