name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. API Component: Typecheck & Integration Tests (Vitest + PostgreSQL)
  # ==========================================
  api-check:
    name: API (Typecheck & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aoweb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoweb
      TOKEN_AUTH: changeme
      CORS_ORIGIN: http://localhost:3000
      POSTGRES_DB: aoweb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'api/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build (to run migrations)
        run: pnpm run build

      - name: Run DB Migrations
        run: pnpm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoweb

      - name: Start API server in background
        run: node dist/server.js &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aoweb
          TOKEN_AUTH: changeme
          CORS_ORIGIN: http://localhost:3000
          PORT: 3001

      - name: Wait for API to be ready
        run: |
          for i in {1..20}; do
            if curl -s http://127.0.0.1:3001/health > /dev/null 2>&1; then
              echo "API ready!"
              break
            fi
            echo "Waiting for API ($i/20)..."
            sleep 3
          done

      - name: Run Tests (Vitest)
        run: pnpm test
        env:
          API_TEST_URL: http://127.0.0.1:3001
          API_TEST_AUTH: changeme

  # ==========================================
  # 2. Server Component: Typecheck & Lint (ESLint)
  # ==========================================
  server-check:
    name: Server (Typecheck & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'server/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

  # ==========================================
  # 3. Frontend Component: Typecheck & Lint (Next.js/ESLint)
  # ==========================================
  frontend-check:
    name: Frontend (Typecheck & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

  # ==========================================
  # 4. Docker Build Verification (parallel matrix)
  # ==========================================
  docker-check:
    name: Docker Build Check (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, server, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:ci-test
